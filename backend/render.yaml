# Reference of the Render settings for the API (the README walks through creating the service in the dashboard).
services:
  - type: web
    name: ecommerce-backend
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    envVars:
      - key: APP_NAME
        value: Ecommerce
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_URL
        fromService:
          type: web
          name: ecommerce-backend
          property: host
      - key: DB_CONNECTION
        value: sqlite
      - key: DB_DATABASE
        value: /var/www/html/database/database.sqlite
      - key: SESSION_DRIVER
        value: file
      - key: CACHE_STORE
        value: file
      - key: QUEUE_CONNECTION
        value: sync
      - key: FILESYSTEM_DISK
        value: public
      - key: FRONTEND_URL
        value: https://frontend-anas2103-projects.vercel.app
      # Paste the output of `php artisan key:generate --show` (must start with base64:)
      - key: APP_KEY
        sync: false
      - key: LOG_LEVEL
        value: warning
      - key: SANCTUM_EXPIRATION
        value: "10080"
      # Seed demo data into an empty database on boot (the free plan's SQLite file is wiped on redeploy).
      - key: SEED_ON_BOOT
        value: "true"
      # Set these in the Render dashboard — never commit them.
      - key: ADMIN_PASSWORD
        sync: false
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_SECRET
        sync: false
      - key: PAYPAL_MODE
        value: sandbox
      - key: STRIPE_SECRET
        sync: false
