# Reference of the Render settings for the API.
# The README ("Deployment") walks through creating this service in the Render dashboard:
# Language Docker · Root Directory backend · Dockerfile ./Dockerfile · Health check /up
services:
  - type: web
    name: ecommerce-api
    runtime: docker
    rootDir: backend
    plan: free
    healthCheckPath: /up
    envVars:
      - key: APP_NAME
        value: Ecommerce
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      # Paste the output of `php artisan key:generate --show` (must start with base64:)
      - key: APP_KEY
        sync: false
      # e.g. https://ecommerce-api.onrender.com
      - key: APP_URL
        sync: false
      # e.g. https://ecommerce-yourname.vercel.app (CORS + links in emails)
      - key: FRONTEND_URL
        sync: false

      # Database: Neon PostgreSQL (free). Paste the connection string from the Neon dashboard.
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_URL
        sync: false

      - key: SESSION_DRIVER
        value: file
      - key: CACHE_STORE
        value: file
      - key: QUEUE_CONNECTION
        value: sync
      - key: LOG_CHANNEL
        value: stderr
      - key: LOG_LEVEL
        value: warning
      - key: SANCTUM_EXPIRATION
        value: "10080"
      # Fill the database with demo data on first boot (only when it is empty).
      - key: SEED_ON_BOOT
        value: "true"
      - key: ADMIN_PASSWORD
        sync: false
      - key: MAIL_MAILER
        value: log

      # Optional — real payments. Without them checkout runs in demo mode.
      - key: STRIPE_SECRET
        sync: false
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_SECRET
        sync: false
      - key: PAYPAL_MODE
        value: sandbox
